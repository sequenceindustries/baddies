name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baddies
          POSTGRES_PASSWORD: baddies
          POSTGRES_DB: baddies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://baddies:baddies@localhost:5432/baddies_test
      AUTH_SECRET: ci-only-secret-not-for-production-use-0000000000
      VERIFICATION_PROVIDER: stub
      PAYMENT_PROVIDER: stub
      MEDIA_STORAGE_PROVIDER: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:migrate:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Fail build if a non-stub environment still points at stub providers
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Reminder: VERIFICATION_PROVIDER/PAYMENT_PROVIDER=stub must never be set in a production deployment target. This check is a placeholder for a real production-readiness gate added in Sprint 4."
